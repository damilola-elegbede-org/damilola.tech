name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-timeouts:
    name: Workflow Timeouts
    runs-on: ubuntu-latest
    # ENG-1952: fails when a workflow job is added without timeout-minutes,
    # so the 2026-08-19 six-hour-runner-hang class can't silently regress.
    # p95 observed 2026-08-21 across 8 recent completed runs: 0.5m
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:workflow-timeouts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # p95 observed 2026-08-21 across 8 recent completed runs: 0.9m (ENG-1952)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    # p95 observed 2026-08-21 across 8 recent completed runs: 0.7m (ENG-1952)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate-prompt
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # p95 observed 2026-08-21 across 8 recent completed runs: 1.7m (ENG-1952)
    timeout-minutes: 8
    env:
      RUN_SCORE_REGRESSION: '1'
      DAMILOLA_SCORE_API_KEY: ${{ secrets.DAMILOLA_SCORE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run generate-prompt
      - run: npm run test -- --coverage --run
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    # p95 observed 2026-08-21 across 8 recent completed runs: 2.0m (ENG-1952)
    timeout-minutes: 8
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  validate-resume:
    name: Validate Resume Schema
    runs-on: ubuntu-latest
    # p95 observed 2026-08-21 across 8 recent completed runs: 0.5m (ENG-1952)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch career-data submodule (soft-fail)
        continue-on-error: true
        env:
          CAREER_DATA_PAT: ${{ secrets.CAREER_DATA_PAT }}
        run: |
          if [[ -n "${CAREER_DATA_PAT}" ]]; then
            git config --global url."https://x-access-token:${CAREER_DATA_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive --depth=1 || \
              echo "::warning::career-data submodule fetch failed with CAREER_DATA_PAT — validation will skip"
          else
            echo "::warning::CAREER_DATA_PAT not set — skipping career-data submodule fetch (validation will skip)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check resume-full.json presence
        id: check
        run: |
          if [[ -f career-data/data/resume-full.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::career-data submodule not checked out — skipping schema validation. Configure CAREER_DATA_PAT secret with repo access to enable hard-gating."
          fi
      - name: Run schema validation
        if: steps.check.outputs.present == 'true'
        run: npm run validate:resume
